<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>pasejo</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <span class="title">pasejo</span>
      <!--
        No aria-live: the popup is a fresh document per open and the
        domain is written exactly once during `main()` before any AT
        traversal can reach the live-region machinery. Marking this
        span as a live region would promise dynamic updates that
        never happen and tax the screen reader's tracking for
        nothing. The status section below DOES need `aria-live`
        because `setStatus` mutates it after first paint.
      -->
      <span id="domain" class="domain"></span>
    </header>

    <section class="controls">
      <label for="store">Store</label>
      <select id="store" aria-label="Store"></select>
      <button id="refresh" type="button" title="Re-query the host">Refresh</button>
    </section>

    <section id="status" class="status" role="status" aria-live="polite"></section>

    <ul id="results" class="results"></ul>

    <script src="../protocol.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
