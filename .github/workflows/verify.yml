name: Verify Commits
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build:
    name: Build + lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: Build unpacked extensions and archives
        run: ./package.sh

      - name: Install web-ext
        run: npm install --no-progress --silent -g web-ext

      # `web-ext lint` is Firefox-targeted, so run it against the Firefox
      # bundle only. The Chromium bundle is validated by `package.sh` (the
      # zip step would fail if manifest.json or any referenced file were
      # missing) and at install time by Chrome itself.
      - name: Lint Firefox bundle
        run: web-ext lint --source-dir=dist/firefox

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: pasejo-extension
          path: |
            dist/pasejo-firefox.xpi
            dist/pasejo-chromium.zip
          if-no-files-found: error

  model:
    name: Model
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check the model
        run: npm run model:typecheck

      - name: Run the model's scenario tests
        run: npm run model:test

      # No fixed seed: every run explores new paths. A violation prints the
      # seed that reproduces it.
      - name: Simulate the model and check its invariants
        run: npm run model:simulate

      - name: Replay fresh model traces against the extension
        run: |
          set -eu
          PASEJO_MODEL_SEED="0x$(od -An -N4 -tx4 /dev/urandom | tr -d ' ')"
          echo "Replaying traces of seed ${PASEJO_MODEL_SEED}"
          PASEJO_MODEL_SEED="${PASEJO_MODEL_SEED}" PASEJO_MODEL_SAMPLES=200 npm run model:replay

      - name: Set up Java for Apalache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Bounded model check with Apalache
        run: npm run model:verify
